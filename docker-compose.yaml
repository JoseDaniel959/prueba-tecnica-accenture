services:
  java_app:
    container_name: java_app
    image: java_app_image:0.0.1
    build: .
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=r2dbc:postgresql://postgres_db/prueba #En esta linea se quitó el puerto porque al parecer con el puerto no realiza peticiones a la base de datos
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=123
    depends_on:
      - postgres_db

  postgres_db:
    container_name: postgres_db
    image: postgres:16.15-alpine
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=prueba
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d


